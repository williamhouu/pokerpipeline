# pokerpipeline tooling config.
#
# Ruff: linter + formatter.
# Mypy: type checker. Strict on new code (admin_panel/), lenient on existing
#   pipeline so we don't have to fix all of William's pre-existing typing
#   to land the admin panel work.

[tool.ruff]
line-length = 88
target-version = "py313"
# Grandfather William's existing pipeline files + subpackages. They work,
# they're tested, and bulk-reformatting them would wipe git blame and create
# a giant diff. New code (admin_panel/, pipeline/preflop/, future modules)
# is enforced strictly. To grandfather a new file, add it here explicitly.
# To enforce a previously-grandfathered file, remove it and ruff --fix.
extend-exclude = [
    "venv",
    "test_output",
    "test_solves",
    "solves",
    "ranges",
    # legacy pipeline files (top-level)
    "pipeline/__init__.py",
    "pipeline/action_history.py",
    "pipeline/batch_solver.py",
    "pipeline/cards.py",
    "pipeline/explanation_generator.py",
    "pipeline/flop_sets.py",
    "pipeline/format_writer.py",
    "pipeline/path_sampler.py",
    "pipeline/piosolver.py",
    "pipeline/preflop_ranges.py",
    "pipeline/question_extractor.py",
    "pipeline/scenario_config.py",
    "pipeline/scenario_spec.py",
    "pipeline/validators.py",
    # legacy subpackage
    "pipeline/fact_extractor",
    "scripts",
    "tests",
]

[tool.ruff.lint]
# Sensible default rule set, not exhaustive.
#   E, W : pycodestyle errors + warnings
#   F    : pyflakes (unused imports, undefined names, etc.)
#   I    : isort (import sorting)
#   B    : flake8-bugbear (likely bugs)
#   UP   : pyupgrade (modern Python idioms)
select = ["E", "W", "F", "I", "B", "UP"]
# Let the formatter handle line length; don't complain twice.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
# Same grandfather pattern as ruff: existing pipeline files + the fact_extractor
# subpackage aren't typed; don't block on them. New pipeline/preflop/ and
# admin_panel/ are strict (see overrides below).
exclude = [
    "pipeline/__init__.py",
    "pipeline/action_history.py",
    "pipeline/batch_solver.py",
    "pipeline/cards.py",
    "pipeline/explanation_generator.py",
    "pipeline/flop_sets.py",
    "pipeline/format_writer.py",
    "pipeline/path_sampler.py",
    "pipeline/piosolver.py",
    "pipeline/preflop_ranges.py",
    "pipeline/question_extractor.py",
    "pipeline/scenario_config.py",
    "pipeline/scenario_spec.py",
    "pipeline/validators.py",
    "pipeline/fact_extractor/",
    "scripts/",
    "tests/",
    "venv/",
]

# When admin_panel imports from pipeline.* (which we do for build_system_prompt
# and the hand-class / board-texture constants), mypy by default follows the
# import and reports errors found inside pipeline/ -- the exclude only stops
# *direct* checking, not transitive. ignore_errors silences imported-module
# errors so admin_panel work isn't blocked by pre-existing pipeline typing
# debt. When/if we type-clean pipeline, drop this override.
[[tool.mypy.overrides]]
module = "pipeline.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "admin_panel.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
